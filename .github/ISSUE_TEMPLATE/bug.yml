name: Bug report
description: Something does not work as the SRS or the documentation says.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
      description: Reference the requirement ID if there is one (e.g. FR-OBL-05).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in as a Contract Manager
        2. Open …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [frontend, backend, database, docs]
      multiple: true
  - type: textarea
    id: context
    attributes:
      label: Environment / logs / screenshots
