[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "coms-backend"
version = "0.1.0"
description = "Contract & Obligation Management System - backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    "python-multipart>=0.0.20",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx2>=2.16",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-python-dateutil>=2.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N"]
ignore = [
    "B008", # FastAPI's Depends() in argument defaults is idiomatic.
    "E501", # Line length is enforced by ruff format.
]

[tool.ruff.lint.isort]
# The local alembic/ folder holds migrations; the import is the Alembic library.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works; test names carry TC IDs (TC_CON_01); test credentials are fixtures.
"tests/**" = ["S101", "S105", "S106", "N802"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "req(*ids): SRS requirement IDs covered by this test (e.g. FR-CON-01)",
]
