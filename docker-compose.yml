# Local development infrastructure. The API and frontend run on the host (see README).
# Later modules add services here as they need them (Redis for background jobs, Mailpit for email).
name: coms

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coms}
      POSTGRES_DB: ${POSTGRES_DB:-coms}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
